name: Import cleared assets
on:
  push:
    branches: [chore/clear-map-texture-licenses]
    paths: [.github/workflows/import-cleared-assets.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack reviewed source package
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile
          root = Path.cwd().resolve()
          package = root / '_source-import.zip'
          assert hashlib.sha256(package.read_bytes()).hexdigest() == '402cefeab6d433675eb6e292bede50133d1d894537c9be0bbd84a487079a2536'
          allowed = {'src','config','scripts','tests','docs','assets','.github'}
          root_files = {'README.md','LICENSE','THIRD_PARTY_NOTICES.md','CONTRIBUTING.md','CODE_OF_CONDUCT.md','SECURITY.md','ROADMAP.md','package.json','package-lock.json','requirements.txt','requirements-assets.txt','.nvmrc','.gitignore','.prettierignore','.prettierrc.json','playwright.config.mjs'}
          with zipfile.ZipFile(package) as archive:
              entries = archive.infolist()
              assert sum(entry.file_size for entry in entries) < 100_000_000
              for entry in entries:
                  relative = Path(entry.filename)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert (len(relative.parts) > 1 and relative.parts[0] in allowed) or entry.filename in root_files
                  assert not entry.filename.startswith('.github/workflows/')
                  assert (root / relative).resolve().is_relative_to(root)
              archive.extractall(root)
      - run: git rm --ignore-unmatch assets/art/grid-mask.png docs/licensing/grid-mask-prompt.txt _source-import.zip
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit verified sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Replace unclear maps and textures with reproducible public-domain assets"
          git push origin HEAD:chore/clear-map-texture-licenses
