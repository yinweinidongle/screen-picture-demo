<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#071713" />
    <meta
      name="description"
      content="衡水蔬菜产业大数据平台，通过三维番茄植株探索温室水肥、气象、产销与生育阶段。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%230e2a22'/%3E%3Cpath d='M12 34Q12 11 37 9Q37 32 15 34M11 39 31 16' fill='none' stroke='%2396e7aa' stroke-width='3'/%3E%3C/svg%3E"
    />
    <title>衡水 · 蔬菜产业大数据平台</title>
    <style>
      /*__SCREEN_CSS__*/
      /*__INSTRUMENTS_CSS__*/
      /*__FINISH_CSS__*/
    </style>
  </head>
  <body>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="bot-leaf" viewBox="0 0 36 36">
        <path d="M6 28Q4 9 29 5Q29 27 9 29m-5 4L23 12M14 23l-1-7m5 3 6-1" />
      </symbol>
      <symbol id="bot-return" viewBox="0 0 24 24">
        <path d="m9 6-6 6 6 6m-5-6h11a5 5 0 0 0 5-5" />
      </symbol>
      <symbol id="bot-crop" viewBox="0 0 24 24">
        <path d="M12 21V9m0 3Q3 12 3 4q9 0 9 8zm0 4q1-9 10-10 0 8-10 10z" />
      </symbol>
      <symbol id="bot-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8" />
        <path d="M12 6v6l4 2" />
      </symbol>
      <symbol id="bot-tags" viewBox="0 0 24 24">
        <path d="M3 5h18v12H10l-5 4v-4H3zM7 9h10m-10 4h6" />
      </symbol>
      <symbol id="bot-expand" viewBox="0 0 24 24">
        <path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6" />
      </symbol>
      <symbol id="bot-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.6 7M4 4v6h6" /></symbol>
      <symbol id="bot-pause" viewBox="0 0 24 24">
        <path d="M8 5v14m8-14v14" stroke-width="3" />
      </symbol>
      <symbol id="bot-play" viewBox="0 0 24 24"><path d="m7 5 11 7-11 7z" /></symbol>
    </svg>
    <main
      id="lab"
      data-leaf="/*__VERDANT_LEAF__*/"
      data-scan-leaf="/*__VERDANT_VEINS__*/"
      data-camera="/*__VERDANT_CAMERAS__*/"
      data-fascia="/*__VERDANT_FASCIA__*/"
      data-bezel="/*__VERDANT_BEZEL__*/"
    >
      <header class="mast" data-finish="mast">
        <div class="brand">
          <svg class="logo" aria-hidden="true"><use href="#bot-leaf" /></svg>
          <div><b>衡水</b><small>HENGSHUI</small></div>
        </div>
        <div class="mast-title">
          <p lang="en">VERDANT OBSERVATORY</p>
          <h1>蔬菜产业大数据平台</h1>
        </div>
        <a class="home" href="home.html" aria-label="返回展厅"
          ><svg class="ui-icon" aria-hidden="true"><use href="#bot-return" /></svg
          ><span>返回展厅</span></a
        >
      </header>
      <section class="archive-bar" aria-label="所选温室与采样信息">
        <div class="plot-field">
          <svg class="ui-icon" aria-hidden="true"><use href="#bot-crop" /></svg>
          <div>
            <label for="plot">观测温室</label
            ><select id="plot"></select>
          </div>
        </div>
        <div class="archive-stat"><span>栽培品种</span><strong id="cultivar"></strong></div>
        <div class="archive-stat">
          <span>定植株数</span><strong><b id="plant-count"></b> <small>株</small></strong>
        </div>
        <div class="archive-stat">
          <span>移栽天数</span><strong><b id="day"></b> <small>天</small></strong>
        </div>
        <div class="record-date">
          <i></i><span>演示快照</span
          ><time datetime="2026-11-26T09:40:00+08:00">2026.11.26 <b>09:40</b></time>
        </div>
      </section>
      <div class="deck">
        <section class="instrument irrigation" data-finish="irrigation"></section>
        <section class="instrument trade" data-finish="trade"></section>
        <section class="specimen" data-finish="specimen" aria-labelledby="specimen-heading">
          <img class="glasshouse" alt="" src="/*__VERDANT_HOUSE__*/" />
          <div class="specimen-shade"></div>
          <header class="specimen-head">
            <div>
              <p class="micro">SPECIMEN ATLAS</p>
              <h2 id="specimen-heading">番茄<span lang="la">Solanum lycopersicum</span></h2>
            </div>
            <div class="imaging" aria-label="成像模式">
              <button data-view="scan" aria-pressed="true">叶脉显影</button
              ><button data-view="natural" aria-pressed="false">自然光</button>
            </div>
          </header>
          <div
            id="specimen-host"
            tabindex="0"
            role="group"
            aria-label="三维番茄植株，可拖动旋转、滚轮缩放，使用方向键旋转，点击果实观察"
          ></div>
          <aside class="annotation leaf-note"><b>果序观察</b><span id="crop-note"></span></aside>
          <aside class="annotation stage-note">
            <b>当前期特征</b><span id="stage-note"></span>
          </aside>
          <output id="fruit-detail" class="fruit-detail" hidden></output>
          <div class="viewport-tools">
            <span id="view-hint">拖动旋转 · 点选果实</span
            ><button
              id="labels"
              class="square"
              aria-label="观察标注"
              aria-pressed="true"
              title="显示或隐藏观察标注"
            >
              <svg class="ui-icon"><use href="#bot-tags" /></svg>
            </button>
            <button id="expand" class="square" aria-label="展开植株" title="展开植株">
              <svg class="ui-icon"><use href="#bot-expand" /></svg>
            </button>
            <button id="pause" class="square" aria-label="暂停动效">
              <svg class="ui-icon"><use href="#bot-pause" /></svg></button
            ><button id="reset" class="square" aria-label="复位视角" title="复位视角">
              <svg class="ui-icon"><use href="#bot-reset" /></svg>
            </button>
          </div>
          <nav class="growth" aria-label="选择生育阶段">
            <div class="growth-label">
              <p class="micro">PHENOLOGY</p>
              <h3>生育阶段</h3>
            </div>
            <div id="stages"></div>
          </nav>
        </section>
        <section class="instrument climate" data-finish="climate"></section>
        <section class="instrument inspection" data-finish="inspection"></section>
      </div>
    </main>
    <script>
      /*__RUNTIME__*/
    </script>
    <script>
      /*__MODULE_BUNDLE__*/
    </script>
  </body>
</html>
