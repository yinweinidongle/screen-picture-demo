<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111416" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141617'/%3E%3Cpath d='M4 24L17 6h6L10 24zm11 0L25 10h4L19 24z' fill='%23ddfa5d'/%3E%3C/svg%3E"
    />
    <title>超跑风洞实验室 · AERO / LAB</title>
    <style>
      @font-face {
        font-family: 'Barlow Condensed';
        src: url('/*__AERO_FONT__*/') format('truetype');
        font-style: italic;
        font-weight: 800;
        font-display: swap;
      }
      /*__SCREEN_CSS__*/
    </style>
  </head>
  <body>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7M7 12h14" /></symbol>
      <symbol id="i-replay" viewBox="0 0 24 24">
        <path d="M4 5v6h6M4.5 10.5A8 8 0 1 1 4 15" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2" />
      </symbol>
      <symbol id="i-import" viewBox="0 0 24 24">
        <path d="M12 15V3m-4 4 4-4 4 4M4 14v6h16v-6" />
      </symbol>
      <symbol id="i-view" viewBox="0 0 24 24">
        <path d="m12 3 9 5-9 5-9-5 9-5Zm-9 5v9l9 5 9-5V8m-9 5v9" />
      </symbol>
      <symbol id="i-paint" viewBox="0 0 24 24">
        <path d="m4 13 9-9 8 8-9 9H4v-8Z" />
        <path d="m9 8 8 8M4 21h16" />
      </symbol>
      <symbol id="i-wind" viewBox="0 0 24 24">
        <path d="M2 8h12a3 3 0 1 0-3-3M2 12h17a3 3 0 1 0-3-3M2 16h10a3 3 0 1 1-3 3" />
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v17h18M6 16l5-3 4-4 5-6" /></symbol>
      <symbol id="i-mouse" viewBox="0 0 24 24">
        <rect x="6" y="2" width="12" height="20" rx="6" />
        <path d="M12 5v5" />
      </symbol>
    </svg>
    <main id="lab" data-mode="studio">
      <header class="mast">
        <div class="brand">
          <i class="brand-mark" aria-hidden="true"></i
          ><strong lang="en">AERO<span>/</span>LAB</strong>
        </div>
        <h1>超跑风洞实验室</h1>
        <nav class="modes" aria-label="体验模式">
          <button type="button" data-mode="studio" aria-pressed="true" disabled>风洞影棚</button>
          <button type="button" data-mode="tunnel" aria-pressed="false" disabled>时空隧道</button>
          <button type="button" data-mode="pilot" aria-pressed="false" disabled>自动驾驶</button>
        </nav>
        <a class="return" href="home.html"
          ><svg><use href="#i-back" /></svg>返回展厅</a
        >
      </header>
      <section class="chamber" aria-labelledby="car-name">
        <div
          id="stage"
          data-renderer="loading"
          data-model="/*__AERO_CAR__*/"
          data-front-area="2.2839"
          data-side-area="4.3632"
          data-studio="/*__AERO_STUDIO__*/"
          data-livery="/*__AERO_LIVERY__*/"
        >
          <canvas
            id="vehicle"
            aria-label="三维超跑，方向键旋转，按加减键缩放"
            tabindex="0"
          ></canvas>
          <img id="poster" data-src="/*__AERO_POSTER__*/" alt="Aventador 影棚实录" hidden />
        </div>
        <div class="car-heading">
          <div class="model-by" id="car-make">LAMBORGHINI</div>
          <h2 id="car-name" lang="en">AVENTADOR</h2>
        </div>
        <div class="stage-tools">
          <button id="light" type="button" aria-pressed="false" disabled>
            <svg><use href="#i-sun" /></svg><span>明调影棚</span>
          </button>
          <button id="import" type="button" disabled>
            <svg><use href="#i-import" /></svg><span>载入 GLB</span>
          </button>
          <input id="file" type="file" accept=".glb,model/gltf-binary" hidden />
        </div>
        <p class="load-message" id="message" role="status">正在布置影棚…</p>
        <div class="chamber-foot">
          <div class="cameras" role="group" aria-label="镜头预设">
            <svg aria-hidden="true"><use href="#i-view" /></svg>
            <button data-camera="hero" aria-pressed="true" disabled>前 ¾</button
            ><button data-camera="side" aria-pressed="false" disabled>正侧</button
            ><button data-camera="top" aria-pressed="false" disabled>俯视</button>
          </div>
          <span class="orbit-hint"
            ><svg><use href="#i-mouse" /></svg>拖动环绕 · 滚轮缩放</span
          >
          <div class="drive-hud" hidden>
            <div><b id="hud-speed">0</b><small>KM/H</small></div>
            <span id="hud-state"></span>
          </div>
          <div class="drive-view-tools">
            <button type="button" id="reset-view" hidden>复位视角</button>
            <button type="button" class="back-studio" hidden>返回影棚</button>
          </div>
        </div>
      </section>
      <div class="instruments">
        <section class="instrument paint-panel" aria-labelledby="paint-title">
          <div class="panel-heading">
            <h2 id="paint-title">
              <svg><use href="#i-paint" /></svg>车身涂层
            </h2>
            <span class="caption">SURFACE</span>
          </div>
          <div class="paint-options" id="paints" role="group" aria-label="选择车漆"></div>
          <div class="paint-readout">
            <strong id="paint-name">熔岩橙</strong
            ><button type="button" id="replay" class="text-control" disabled>
              <svg><use href="#i-replay" /></svg>重播过渡
            </button>
          </div>
          <div class="control-label">
            <label for="reveal">裁剪位置</label><output id="reveal-value" for="reveal">100%</output>
          </div>
          <input
            id="reveal"
            type="range"
            min="0"
            max="100"
            value="100"
            aria-label="材质裁剪位置"
            disabled
          />
        </section>
        <section class="instrument wind-panel" aria-labelledby="wind-title">
          <div class="panel-heading">
            <h2 id="wind-title">
              <svg><use href="#i-wind" /></svg>风洞工况
            </h2>
            <span class="bench-status" id="bench-state">就绪</span>
          </div>
          <div class="control-label">
            <label for="speed">来流风速</label
            ><output id="speed-value" for="speed">160 km/h</output>
          </div>
          <input id="speed" type="range" min="0" max="300" step="5" value="160" />
          <div class="control-label">
            <label for="yaw">侧风偏角</label><output id="yaw-value" for="yaw">0°</output>
          </div>
          <input id="yaw" type="range" min="-15" max="15" step="1" value="0" />
          <div class="wind-actions">
            <button class="run" id="run" type="button" aria-pressed="false">
              <i aria-hidden="true"></i><span>启动风洞</span></button
            ><button id="end-test" type="button" hidden>结束试验</button>
          </div>
        </section>
        <section class="instrument results-panel" aria-labelledby="result-title">
          <div class="panel-heading">
            <h2 id="result-title">
              <svg><use href="#i-chart" /></svg>气动力估算
            </h2>
            <span class="caption">DRAG / SPEED</span>
          </div>
          <div class="measurements">
            <dl class="drag-reading">
              <dt>空气阻力</dt>
              <dd><b id="force">0</b><small>N</small></dd>
            </dl>
            <dl>
              <dt>动压</dt>
              <dd><b id="pressure">0</b><small>kPa</small></dd>
              <dt>阻力系数</dt>
              <dd><b id="cd">0.320</b><small>Cd</small></dd>
            </dl>
          </div>
          <svg
            id="curve"
            viewBox="0 0 440 76"
            preserveAspectRatio="none"
            role="img"
            aria-label="阻力与风速的关系"
          >
            <defs>
              <linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1">
                <stop stop-color="#ddfb66" stop-opacity=".19" />
                <stop offset="1" stop-color="#ddfb66" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path class="gridlines" d="M3 13H437M3 40H437M3 68H437" />
            <path id="chart-area" fill="url(#chart-fill)" />
            <path id="chart-line" />
            <path id="chart-guide" />
            <circle id="chart-dot" r="3.5" />
          </svg>
          <div class="chart-axis"><span>0</span><span>150</span><span>300 km/h</span></div>
        </section>
        <section class="instrument drive-panel" hidden aria-labelledby="drive-title">
          <div class="panel-heading">
            <h2 id="drive-title">驾驶控制</h2>
            <span class="bench-status" id="drive-status"></span>
          </div>
          <div id="warp-settings">
            <div class="control-label">
              <label for="warp-speed">巡航速度</label
              ><output id="warp-value" for="warp-speed">260 km/h</output>
            </div>
            <input id="warp-speed" type="range" min="100" max="320" step="10" value="260" />
          </div>
          <div id="traffic-settings" hidden>
            <div class="control-label">测试路况</div>
            <div class="scenario-options" role="group" aria-label="测试路况">
              <button type="button" data-scenario="pass" aria-pressed="true">前方慢车</button>
              <button type="button" data-scenario="follow" aria-pressed="false">密集车流</button>
              <button type="button" data-scenario="mixed" aria-pressed="false">混合车流</button>
            </div>
          </div>
          <div class="drive-actions">
            <button type="button" id="drive-pause" aria-pressed="false">暂停</button>
            <button type="button" id="drive-step" disabled>单步</button>
            <button type="button" id="drive-restart">重新起跑</button>
          </div>
        </section>
        <section class="instrument telemetry-panel" hidden aria-labelledby="telemetry-title">
          <div class="panel-heading">
            <h2 id="telemetry-title">行驶遥测</h2>
            <span class="caption" id="telemetry-unit"></span>
          </div>
          <div class="road-telemetry">
            <div>
              <span id="primary-label"></span><strong id="drive-primary">0</strong
              ><small id="primary-unit"></small>
            </div>
            <canvas id="road-scope" width="400" height="116" aria-hidden="true"></canvas>
          </div>
          <div class="telemetry-foot">
            <span id="drive-secondary"></span><span id="drive-plan"></span>
          </div>
        </section>
      </div>
      <footer>
        <span id="wind-note">简化气动模型 · 迎风面积 <b id="section-area">2.28</b> m²</span
        ><span id="drive-note" hidden>封闭道路驾驶模拟</span
        ><span class="credits"
          ><a
            id="model-credit"
            href="https://sketchfab.com/3d-models/lamborghini-aventador-888e37a3641d4f7b94bc1a39396e2441"
            target="_blank"
            rel="noopener"
            >Aventador · Arion Digital</a
          >
          <a
            id="model-license"
            href="https://creativecommons.org/licenses/by/4.0/"
            target="_blank"
            rel="noopener"
            >CC BY 4.0</a
          ></span
        >
      </footer>
    </main>
    <script>
      /*__RUNTIME__*/
    </script>
    <script>
      /*__MODULE_BUNDLE__*/
    </script>
  </body>
</html>
