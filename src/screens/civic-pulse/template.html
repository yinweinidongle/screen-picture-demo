<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07141b" />
    <meta
      name="description"
      content="榕城智慧市政大屏。通过三维感知树探索六城区的市政设施、工单与处置进度。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d2531'/%3E%3Cpath d='m5 12 11 7 11-7M8 5l8 6 8-6m-8 6v16' stroke='%237be9d6' stroke-width='3' fill='none'/%3E%3C/svg%3E"
    />
    <title>榕城 · 智慧市政运行中枢</title>
    <style>
      /*__SCREEN_CSS__*/
    </style>
  </head>
  <body>
    <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-brand" viewBox="0 0 48 48">
        <g
          stroke="currentColor"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.4"
        >
          <path d="M24 38V14m0 8L14 16V9m10 18 13-8v-7M24 34 8 24v-6m16 16 10-6" />
          <path d="m20 12 4-6 4 6-4 5z" fill="currentColor" />
        </g>
        <g fill="currentColor">
          <circle cx="8" cy="16" r="2.2" />
          <circle cx="14" cy="7" r="2.2" />
          <circle cx="37" cy="10" r="2.2" />
          <circle cx="36" cy="27" r="2" />
        </g>
      </symbol>
      <symbol id="i-health" viewBox="0 0 24 24"><path d="M2 13h5l3-7 4 13 3-8h5" /></symbol>
      <symbol id="i-ticket" viewBox="0 0 24 24">
        <path d="M7 4h11v15H7zM4 7v15h11M10 9h5m-5 4h5" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 5 7-3 7 3v6c0 5-4 8-7 10-3-2-7-5-7-10zM8 11l3 3 5-6" />
      </symbol>
      <symbol id="i-sensor" viewBox="0 0 24 24">
        <path d="M7 5a9 9 0 0 0 0 14m10-14a9 9 0 0 1 0 14M9.5 8a5 5 0 0 0 0 8m5-8a5 5 0 0 1 0 8" />
        <circle cx="12" cy="12" r="1.6" />
      </symbol>
      <symbol id="i-water" viewBox="0 0 24 24">
        <path d="M2 15q3-3 6 0t6 0 7 0M2 19q3-3 6 0t6 0 7 0M9 8l3-5 3 5a3 3 0 1 1-6 0z" />
      </symbol>
      <symbol id="i-road" viewBox="0 0 24 24">
        <path d="M3 20 8 4m13 16L16 4M12 4v4m0 4v3m0 3v3" />
      </symbol>
      <symbol id="i-light" viewBox="0 0 24 24">
        <path d="M8 20h8m-7-4c0-3-3-3.8-3-8a6 6 0 0 1 12 0c0 4.2-3 5-3 8z" />
      </symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24">
        <path d="M4 17C1 7 13 4 21 3c0 10-4 18-13 15m-5 3L16 8" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24">
        <path d="M19 10c0 5-7 11-7 11s-7-6-7-11a7 7 0 1 1 14 0z" />
        <circle cx="12" cy="10" r="2" />
      </symbol>
      <symbol id="i-exit" viewBox="0 0 24 24">
        <path d="M15 5h5v14h-5M4 12h12M9 7l-5 5 5 5" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.5 7M4 4v6h6" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <path d="M8 5v14m8-14v14" stroke-width="3.3" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" /></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24">
        <path d="M3 12c0-3 4-5 9-5s9 2 9 5-4 5-9 5m-4-3 4 3-4 3" />
        <path d="M12 3v8" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
    </svg>
    <main class="console-shell" data-fascia="/*__CIVIC_FASCIA__*/" data-bezel="/*__CIVIC_BEZEL__*/">
      <header class="mast">
        <div class="mast-city">
          <span class="brand-mark"
            ><svg aria-hidden="true"><use href="#i-brand" /></svg
          ></span>
          <div><strong>榕城</strong><small lang="en">FUZHOU</small></div>
          <span class="snapshot"><i></i>演示快照</span>
        </div>
        <div class="identity">
          <p lang="en">RONGCHENG <b>/</b> CIVIC PULSE</p>
          <h1>智慧市政运行中枢</h1>
        </div>
        <div class="mast-meta">
          <time datetime="2026-11-26T16:00:00+08:00"><b>16:00</b><small>2026.11.26</small></time
          ><a class="home-link" href="home.html"
            ><svg class="icon"><use href="#i-exit" /></svg><span>返回展厅</span></a
          >
        </div>
      </header>
      <section class="metrics" aria-label="当前所选范围的运行指标">
        <article>
          <span class="metric-icon"
            ><svg class="icon"><use href="#i-health" /></svg
          ></span>
          <div>
            <h2>市政健康指数</h2>
            <p><strong id="health">—</strong><small>/ 100</small></p>
          </div>
          <span class="meter-line" aria-hidden="true"><i id="health-bar"></i></span>
        </article>
        <article>
          <span class="metric-icon"
            ><svg class="icon"><use href="#i-ticket" /></svg
          ></span>
          <div>
            <h2>近 24 小时受理</h2>
            <p><strong id="tickets">—</strong><small>件</small></p>
          </div>
          <svg class="spark" viewBox="0 0 82 32" aria-label="近 12 小时受理趋势" role="img">
            <path id="spark" />
          </svg>
        </article>
        <article>
          <span class="metric-icon"
            ><svg class="icon"><use href="#i-check" /></svg
          ></span>
          <div>
            <h2>按期办结率</h2>
            <p><strong id="timely">—</strong><small>%</small></p>
          </div>
          <span class="meter-line" aria-hidden="true"><i id="timely-bar"></i></span>
        </article>
        <article>
          <span class="metric-icon"
            ><svg class="icon"><use href="#i-sensor" /></svg
          ></span>
          <div>
            <h2>在线感知终端</h2>
            <p><strong id="online">—</strong><small>台</small></p>
          </div>
          <span class="metric-note">在线率 <b id="availability"></b></span>
        </article>
      </section>
      <div class="field-grid">
        <section class="panel chart-panel">
          <header class="panel-title">
            <h2>工单流量</h2>
            <div class="range" aria-label="趋势时段">
              <button type="button" data-period="12" aria-pressed="false">12时</button
              ><button type="button" data-period="24" aria-pressed="true">24时</button>
            </div>
          </header>
          <div class="trend-legend">
            <span><i></i>受理</span><span><i></i>办结</span><small>单位 · 件</small>
          </div>
          <div
            class="trend-box"
            tabindex="0"
            role="group"
            aria-label="逐小时工单流量，用左右方向键查看数量"
          >
            <svg
              id="trend"
              viewBox="0 0 300 140"
              preserveAspectRatio="none"
              role="img"
              aria-label="受理和办结曲线"
            ></svg
            ><output id="trend-tip" hidden></output>
          </div>
        </section>
        <section class="panel service-panel">
          <header class="panel-title">
            <h2>市政服务领域</h2>
            <button type="button" id="clear-service" class="clear" disabled>全部领域</button>
          </header>
          <div id="services" class="service-list" aria-label="选择服务领域"></div>
        </section>
        <section class="hero panel" aria-labelledby="tree-heading">
          <img class="river" src="/*__CIVIC_RIVER__*/" alt="" />
          <div class="hero-veil"></div>
          <header class="hero-head">
            <div>
              <p class="eyebrow">NEURAL CANOPY</p>
              <h2 id="tree-heading">城市感知树</h2>
            </div>
            <div class="hero-loc">
              <svg class="icon"><use href="#i-pin" /></svg
              ><span id="hero-location">福州 · 全市</span>
            </div>
          </header>
          <div
            id="canopy"
            class="canopy"
            tabindex="0"
            role="group"
            aria-label="三维市政感知树，拖动或使用方向键旋转，按空格暂停，Home 复位"
          >
            <canvas class="spatial" aria-hidden="true"></canvas
            ><canvas class="flat" hidden aria-hidden="true"></canvas>
            <div id="pins"></div>
          </div>
          <div class="hero-foot">
            <div><i id="signal-dot"></i><strong id="signal-name">全域感知</strong></div>
            <span class="drag-hint"
              ><svg class="icon"><use href="#i-rotate" /></svg>拖动旋转</span
            >
            <div class="hero-tools">
              <button type="button" id="play" aria-label="暂停信号">
                <svg class="icon"><use href="#i-pause" /></svg></button
              ><button type="button" id="reset" aria-label="复位视角" title="复位视角">
                <svg class="icon"><use href="#i-reset" /></svg>
              </button>
            </div>
          </div>
        </section>
        <section class="panel state-panel">
          <header class="panel-title">
            <h2>工单处置</h2>
            <span class="panel-unit">近 24 小时</span>
          </header>
          <div class="state-body">
            <div class="donut">
              <svg id="donut" viewBox="0 0 120 120" aria-hidden="true"></svg>
              <div><b id="done-percent"></b><span>办结率</span></div>
            </div>
            <dl id="state-list"></dl>
          </div>
        </section>
        <section class="panel feed-panel">
          <header class="panel-title">
            <h2>现场动态</h2>
            <button type="button" id="all-events" class="clear">
              查看工单 <span aria-hidden="true">↗</span>
            </button>
          </header>
          <div id="feed" class="events"></div>
        </section>
      </div>
      <nav class="districts" aria-label="选择监测辖区">
        <div class="district-intro">
          <span class="eyebrow">DISTRICTS</span>
          <h2>辖区监测</h2>
        </div>
        <div id="district-list"></div>
      </nav>
    </main>
    <dialog id="work-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <p class="eyebrow">MUNICIPAL DISPATCH</p>
        <button id="close-dialog" type="button" class="square" aria-label="关闭">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
    </dialog>
    <script>
      /*__RUNTIME__*/
    </script>
    <script>
      /*__MODULE_BUNDLE__*/
    </script>
  </body>
</html>
