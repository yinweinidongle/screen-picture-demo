<aside class="chili-left" aria-label="水肥和出入库">
  <section class="chili-irrigation" aria-labelledby="chili-irrigation-title">
    <h2 class="chili-panel-title" id="chili-irrigation-title">水肥控制</h2>
    <div class="chili-irrigation-controls">
      <button
        class="chili-water-tile chili-water-master"
        type="button"
        role="switch"
        aria-checked="true"
        aria-label="浇水"
        data-chili-switch="water"
      >
        <svg class="chili-water-icon" viewBox="0 0 27 28" aria-hidden="true">
          <path
            fill="currentColor"
            d="M2 5h5V3h10l3 2v17h-3v3H4v-3H2v-3h2v-5H2zm6 0v8h8V5zm13 1h2v15h-2zm3-2h2v3h-2zm0 5h2v2h-2zm0 9h2v4h-2z"
          />
          <path d="M10 8v3m3-4v3m7 14h4" fill="none" stroke="currentColor" stroke-width="1.3" />
        </svg>
        <span class="chili-water-name">浇水</span>
        <span class="chili-water-switch" aria-hidden="true"></span>
        <span class="chili-water-status">当前状态：<strong>开</strong></span>
      </button>
      <div class="chili-water-grid">
        <button
          class="chili-water-tile"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="A桶"
          data-chili-switch="tankA"
        >
          <span class="chili-water-name">A桶</span>
          <span class="chili-water-switch" aria-hidden="true"></span>
          <span class="chili-water-status">当前状态：<strong>关</strong></span>
        </button>
        <button
          class="chili-water-tile"
          type="button"
          role="switch"
          aria-checked="true"
          aria-label="B桶"
          data-chili-switch="tankB"
        >
          <span class="chili-water-name">B桶</span>
          <span class="chili-water-switch" aria-hidden="true"></span>
          <span class="chili-water-status">当前状态：<strong>开</strong></span>
        </button>
        <button
          class="chili-water-tile"
          type="button"
          role="switch"
          aria-checked="true"
          aria-label="C桶"
          data-chili-switch="tankC"
        >
          <span class="chili-water-name">C桶</span>
          <span class="chili-water-switch" aria-hidden="true"></span>
          <span class="chili-water-status">当前状态：<strong>开</strong></span>
        </button>
        <button
          class="chili-water-tile"
          type="button"
          role="switch"
          aria-checked="false"
          aria-label="D桶"
          data-chili-switch="tankD"
        >
          <span class="chili-water-name">D桶</span>
          <span class="chili-water-switch" aria-hidden="true"></span>
          <span class="chili-water-status">当前状态：<strong>关</strong></span>
        </button>
      </div>
    </div>
  </section>

  <section class="chili-shipments" aria-labelledby="chili-shipments-title">
    <h2 class="chili-panel-title" id="chili-shipments-title">重点品种出入库情况</h2>
    <div class="chili-shipments-key">
      <span>单位：亿元</span>
      <div class="chili-shipments-legend" role="group" aria-label="显示统计系列">
        <button type="button" data-chili-series="outbound" aria-pressed="true">出库</button>
        <button type="button" data-chili-series="inbound" aria-pressed="true">入库</button>
      </div>
    </div>
    <svg
      class="chili-shipments-chart"
      viewBox="0 0 344 164"
      role="img"
      aria-label="2019年至2023年辣椒出入库货值柱状图"
    >
      <defs>
        <linearGradient
          id="chili-outbound-bar"
          x1="0"
          y1="0"
          x2="0"
          y2="1"
          gradientUnits="objectBoundingBox"
        >
          <stop offset="0" stop-color="#ffad12" />
          <stop offset=".45" stop-color="#b2670a" />
          <stop offset="1" stop-color="#8b4e01" stop-opacity="0" />
        </linearGradient>
        <linearGradient
          id="chili-inbound-bar"
          x1="0"
          y1="0"
          x2="0"
          y2="1"
          gradientUnits="objectBoundingBox"
        >
          <stop offset="0" stop-color="#06dfed" />
          <stop offset=".43" stop-color="#068894" />
          <stop offset="1" stop-color="#075359" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path class="chili-chart-axis" d="M0 .5h344M0 139.5h344" />
      <path class="chili-chart-guide" d="M1 35.5h343M1 70.5h343M1 104.5h343" />
      <g class="chili-chart-numbers" text-anchor="start">
        <text x="4" y="14">120</text>
        <text x="4" y="49">80</text>
        <text x="4" y="84">60</text>
        <text x="4" y="119">40</text>
        <text x="4" y="157">0</text>
      </g>
      <g fill="url(#chili-outbound-bar)" data-chili-bars="outbound">
        <rect x="27" y="105" width="10" height="34"><title>2019年出库：40亿元</title></rect>
        <rect x="92" y="37" width="10" height="102"><title>2020年出库：82亿元</title></rect>
        <rect x="156" y="88" width="10" height="51"><title>2021年出库：50亿元</title></rect>
        <rect x="220" y="24" width="10" height="115"><title>2022年出库：90亿元</title></rect>
        <rect x="285" y="88" width="10" height="51"><title>2023年出库：50亿元</title></rect>
      </g>
      <g fill="url(#chili-inbound-bar)" data-chili-bars="inbound">
        <rect x="43" y="83" width="10" height="56"><title>2019年入库：54亿元</title></rect>
        <rect x="108" y="70" width="10" height="69"><title>2020年入库：62亿元</title></rect>
        <rect x="172" y="36" width="10" height="103"><title>2021年入库：83亿元</title></rect>
        <rect x="236" y="64" width="10" height="75"><title>2022年入库：65亿元</title></rect>
        <rect x="301" y="96" width="10" height="43"><title>2023年入库：45亿元</title></rect>
      </g>
      <g class="chili-chart-numbers" text-anchor="middle">
        <text x="40" y="158">2019</text>
        <text x="104" y="158">2020</text>
        <text x="168" y="158">2021</text>
        <text x="232" y="158">2022</text>
        <text x="301" y="158">2023年</text>
      </g>
    </svg>
  </section>

  <section class="chili-warehouses" aria-labelledby="chili-warehouses-title">
    <h2 class="chili-panel-title" id="chili-warehouses-title">仓库类型对比</h2>
    <div class="chili-warehouse-list">
      <figure class="chili-warehouse chili-warehouse-amber">
        <div class="chili-warehouse-count">148<small>家</small></div>
        <div class="chili-warehouse-globe">
          <svg viewBox="0 0 72 72" aria-hidden="true">
            <path class="chili-fluid-back" d="M0 41q9 6 20 2t19 3 16 1 17-4v29H0z" />
            <path class="chili-fluid-front" d="M0 45q8 7 18 5t18 0 18 1 18-8v29H0z" />
          </svg>
          <strong>28<small>%</small></strong>
        </div>
        <figcaption>恒温库</figcaption>
      </figure>
      <figure class="chili-warehouse chili-warehouse-green">
        <div class="chili-warehouse-count">148<small>家</small></div>
        <div class="chili-warehouse-globe">
          <svg viewBox="0 0 72 72" aria-hidden="true">
            <path class="chili-fluid-back" d="M0 40q9 6 20 2t19 4 16 1 17-4v29H0z" />
            <path class="chili-fluid-front" d="M0 43q8 8 18 6t18 0 18 1 18-8v29H0z" />

          <strong>28<small>%</small></strong>
        </div>
        <figcaption>普通库</figcaption>
      </figure>
      <figure class="chili-warehouse chili-warehouse-blue">
        <div class="chili-warehouse-count">148<small>家</small></div>
        <div class="chili-warehouse-globe">
          <svg viewBox="0 0 72 72" aria-hidden="true">
            <path class="chili-fluid-back" d="M0 41q9 6 20 2t19 3 16 1 17-4v29H0z" />
            <path class="chili-fluid-front" d="M0 45q8 7 18 5t18 0 18 1 18-8v29H0z" />
          </svg>
          <strong>28<small>%</small></strong>
        </div>
        <figcaption>冷藏库</figcaption>
      </figure>
    </div>
  </section>
</aside>

<aside class="chili-right" aria-label="气象和监控">
  <section class="chili-weather" aria-labelledby="chili-weather-title">
    <h2 class="chili-panel-title" id="chili-weather-title">气象数据</h2>
    <dl class="chili-readings">
      <div class="chili-reading">
        <dt>土壤温度</dt>
        <dd><span data-chili-reading="soilTemperature">26.8</span><small>°C</small></dd>
      </div>
      <div class="chili-reading">
        <dt>土壤湿度</dt>
        <dd><span data-chili-reading="soilHumidity">48.5</span><small>%</small></dd>
      </div>
      <div class="chili-reading">
        <dt>光照</dt>
        <dd><span data-chili-reading="illuminance">175</span><small>LUX</small></dd>
      </div>
      <div class="chili-reading">
        <dt>空气温度</dt>
        <dd><span data-chili-reading="airTemperature">30.8</span><small>°C</small></dd>
      </div>
      <div class="chili-reading">
        <dt>空气湿度</dt>
        <dd><span data-chili-reading="airHumidity">37.6</span><small>%</small></dd>
      </div>
      <div class="chili-reading">
        <dt>二氧化碳</dt>
        <dd><span data-chili-reading="carbonDioxide">59.3</span><small>L</small></dd>
      </div>
    </dl>
    <div
      class="chili-growth"
      role="meter"
      aria-label="生长率"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="48.5"
    >
      <svg class="chili-growth-dial" viewBox="0 0 172 119" aria-hidden="true">
        <defs>
          <linearGradient id="chili-dial-fill" x1="0" y1="1" x2=".85" y2="0">
            <stop offset="0" stop-color="#00674c" />
            <stop offset=".55" stop-color="#00aa83" />
            <stop offset="1" stop-color="#00efb8" />
          </linearGradient>
          <linearGradient id="chili-dial-ticks" x1="0" y1="1" x2=".45" y2="0">
            <stop offset="0" stop-color="#06513b" />
            <stop offset=".56" stop-color="#0b7255" />
            <stop offset="1" stop-color="#0e9570" />
          </linearGradient>
          <radialGradient id="chili-dial-core">
            <stop offset="0" stop-color="#093029" stop-opacity=".48" />
            <stop offset="1" stop-color="#093029" stop-opacity=".1" />
          </radialGradient>
        </defs>
        <path d="M8 111a82 82 0 1 1 156 0" fill="none" stroke="#003c31" stroke-width="7" />
        <path d="M18 109a74 74 0 1 1 136 0" fill="none" stroke="#042c27" stroke-width="15" />
        <path
          d="M18 109a74 74 0 1 1 136 0"
          fill="none"
          stroke="url(#chili-dial-ticks)"
          stroke-width="14"
          pathLength="100"
          stroke-dasharray=".54 1.1"
        />
        <path
          class="chili-growth-progress"
          d="M8 111a82 82 0 1 1 156 0"
          fill="none"
          stroke="url(#chili-dial-fill)"
          stroke-width="6"
          pathLength="100"
          stroke-dasharray="61 100"
        />
        <path d="M31 111a59 59 0 1 1 110 0" fill="none" stroke="#006657" stroke-opacity=".66" />
        <ellipse cx="86" cy="90" rx="40" ry="39" fill="url(#chili-dial-core)" />
        <circle cx="106" cy="85" r="1.8" fill="#168887" opacity=".46" />
        <circle cx="108" cy="92" r="1.35" fill="#5ee7d0" opacity=".62" />
      </svg>
      <div class="chili-growth-number">
        <span>生长率</span><strong><span data-chili-growth>48.5</span><small>%</small></strong>
      </div>
    </div>
    <dl class="chili-growth-status">
      <div>
        <svg viewBox="0 0 61 45" aria-hidden="true">
          <path class="chili-status-plinth" d="M6 20v18l9 4h33l7-4V20" />
          <path class="chili-status-base" d="M10 39h41l7 2-9 3H14L3 42z" />
          <path
            d="M17 19a14 14 0 0 1 28 0H32v8a4 4 0 0 1-8 0h2a2 2 0 0 0 4 0v-8z"
            fill="currentColor"
          />
          <path d="M31 4V2" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
        </svg>
        <dt>状态：</dt>
        <dd data-chili-status>好</dd>
      </div>
      <div>
        <svg viewBox="0 0 61 45" aria-hidden="true">
          <path class="chili-status-plinth" d="M6 20v18l9 4h33l7-4V20" />
          <path class="chili-status-base" d="M10 39h41l7 2-9 3H14L3 42z" />
          <path
            d="M18 18a13 13 0 0 0 26 0M22 18h18a9 9 0 1 1-18 0z"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="1.7"
          />
          <path
            d="M19 13a14 14 0 0 1 24 0"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="3"
            stroke-dasharray=".35 6.15"
          />
        </svg>
        <dt>阶段：</dt>
        <dd data-chili-stage>发芽期</dd>
      </div>
    </dl>
  </section>

  <section class="chili-camera" aria-labelledby="chili-camera-title">
    <h2 class="chili-panel-title" id="chili-camera-title">浇灌监控视频</h2>
    <figure class="chili-camera-view" data-chili-camera="0" aria-label="灌溉基地监控示意画面">
      <div class="chili-camera-picture" aria-hidden="true"></div>
      <div class="chili-camera-alternate" aria-hidden="true"></div>
      <button
        class="chili-camera-step chili-camera-prev"
        type="button"
        aria-label="上一监控点"
        data-chili-camera-step="-1"
      >
        <span aria-hidden="true">‹</span>
      </button>
      <button
        class="chili-camera-step chili-camera-next"
        type="button"
        aria-label="下一监控点"
        data-chili-camera-step="1"
      >
        <span aria-hidden="true">›</span>
      </button>
      <figcaption data-chili-camera-caption aria-live="polite">监控1：闸口</figcaption>
    </figure>
  </section>
</aside>
